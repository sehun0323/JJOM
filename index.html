<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚗 본넷 곡선 표시기</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🚗 차량 이미지 본넷 곡선 분석 시뮬레이션</h1>
        
        <input type="file" id="imageUploader" accept="image/*" title="차량 측면 사진을 선택하세요.">
        
        <button onclick="drawCurve()">🔴 본넷 곡선 분석 및 표시</button>
        
        <hr>
        
        <div id="canvasContainer">
            <canvas id="imageCanvas">사용하시는 브라우저는 Canvas를 지원하지 않습니다.</canvas>
            <p id="instructionText">👆 차량 측면 이미지를 업로드하고 버튼을 누르세요.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
